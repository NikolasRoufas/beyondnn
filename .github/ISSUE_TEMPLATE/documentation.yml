name: Documentation issue
description: Something in the documentation is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file or section (a link is ideal).
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing
    validations:
      required: true
