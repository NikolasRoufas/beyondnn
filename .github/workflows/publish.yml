name: Publish to PyPI

# MANUAL ONLY. This workflow never runs on push, tag or release events: the maintainer
# triggers it deliberately (Actions -> Publish to PyPI -> Run workflow) with an existing
# release tag. It publishes with PyPI Trusted Publishing (GitHub OIDC); there is no
# password or API token anywhere. Procedure: docs/release/PYPI_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.1.0 (must exist and equal v<package version>)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify the checkout is exactly the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Verify the tag equals v<package version>
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('beyondnn/__init__.py').read(), re.M).group(1))")
          echo "package version: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package version $VERSION"; exit 1
          fi
          echo "Publishing BeyondNN $VERSION from tag $TAG"
      - name: Build fresh distributions
        run: |
          rm -rf dist
          uv build
          ls -l dist
      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*
      - name: The wheel contains only the package
        run: |
          python -c "import sys, zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); bad = [n for n in names if not n.startswith(('beyondnn/', 'beyondnn-'))]; print(len(names), 'files', bad); sys.exit(1 if bad else 0)"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.tag }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/beyondnn/
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC); no stored credentials
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
