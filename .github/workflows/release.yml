name: Release build

# Builds and checks the distributions and attaches them to the workflow run (a dry run).
# It never publishes: PyPI publication is the separate, manual publish.yml workflow
# (procedure: docs/release/PYPI_RELEASE.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
