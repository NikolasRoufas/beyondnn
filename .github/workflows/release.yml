name: Release build

# Builds and checks the distributions and attaches them to the workflow run.
# It never publishes: PyPI publication is a separate, deliberate step (trusted publishing
# is to be configured before the first release).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
